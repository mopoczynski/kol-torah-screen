<!--
  Yeshiva Kol Torah — Beis Medrash screen (1920x1080, landscape).
  Data (public CSV, read only) from the Google Sheet "Add Your Voice — Site Data":
    Settings, Dedications (Parnes Hayom), Partners (donor wall), Davening Times (weekday), Screen Photos.
  Zmanim, parsha, Tachanun etc. are calculated in the page with the Hebcal library (inlined, GPLv2)
  for the yeshiva's location, outside-Eretz-Yisrael rules. Shabbos times use the rules in SHABBOS below.
  Options in the address: ?theme=dark  ?demo (sample names)  ?date=2027-04-20 (show another day)
-->
<style>
:root{
  --bg:#F3F0E9; --ink:#1E1D1A; --muted:#7A746B; --faint:#A9A398; --rule:#DCD5C7;
  --gold:#9E7B2D; --gold-soft:rgba(158,123,45,.12);
  --plq1:#DEC487; --plq2:#C7A458; --plq-ink:#2A2213; --plq-line:rgba(42,34,19,.32);
  --photo-bg:#E6E1D6; --box:#CBC1AD; --panel:#FAF8F3;
}
:root[data-theme="dark"]{
  --bg:#171614; --ink:#F2EEE6; --muted:#9E978C; --faint:#6E685F; --rule:#34312C;
  --gold:#CFAE62; --gold-soft:rgba(207,174,98,.12); --photo-bg:#0E0D0C; --box:#3E3A33; --panel:#1E1D1A;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);cursor:none}
*{box-sizing:border-box;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif}
.he{font-family:"Frank Ruhl Libre",serif;direction:rtl}
.num{font-family:"Nunito Sans",sans-serif;font-variant-numeric:tabular-nums lining-nums;direction:ltr}
.label{font-family:"Nunito Sans",sans-serif;font-weight:800;font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}

/* ---------- header ---------- */
header{position:absolute;left:40px;right:40px;top:0;height:120px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.h-left{display:flex;align-items:center;gap:28px}
#clock{font-family:"Playfair Display",serif;font-weight:500;font-size:74px;line-height:1;letter-spacing:0;font-variant-numeric:lining-nums tabular-nums}
#engDate{font-size:22px;line-height:1.35;color:var(--muted)}
#engDate b{display:block;font-weight:700;color:var(--ink);font-size:24px}
.h-mid{text-align:center}

.h-right{text-align:right}
#hebDate{font-size:36px;font-weight:700;line-height:1.15}
#parsha{font-size:27px;color:var(--gold);font-weight:500;margin-top:4px}

/* ---------- columns ---------- */
main{position:absolute;left:40px;right:40px;top:128px;bottom:24px;display:grid;grid-template-columns:560px 1fr 500px;gap:22px}
.col{position:relative;min-height:0;display:flex;flex-direction:column;gap:20px}
.box{border:1.5px solid var(--box);border-radius:6px;background:var(--panel);padding:18px 26px 14px;min-height:0}
#wallCol{border:1.5px solid var(--box);border-radius:6px;background:var(--panel);padding:26px 32px 18px;gap:0}

/* section headings */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 8px;direction:rtl}
.sec h2{margin:0;font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:32px;line-height:1}
.sec .aside{font-family:"Frank Ruhl Libre",serif;font-size:22px;color:var(--muted)}

/* time rows */
.rows{direction:rtl;font-family:"Frank Ruhl Libre",serif}
.row{display:flex;justify-content:space-between;align-items:baseline;height:35px;font-size:25px;line-height:35px;border-top:1px solid var(--rule)}
.rows .row:first-child{border-top:0}
.row .t{font-family:"Nunito Sans",sans-serif;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;font-size:24px}
.row .d{font-size:18px;color:var(--muted);margin-inline-start:10px}
.row.past{color:var(--faint)}
.row.next .l,.row.next .t{color:var(--gold);font-weight:700}
.row.next .t{font-weight:800}
.row.today .l{font-weight:700}
.sub{direction:rtl;font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:22px;color:var(--gold);margin:14px 0 2px;display:flex;justify-content:space-between}
.sub span + span{font-weight:400;color:var(--muted)}
#timesCol .row{height:33px;line-height:33px}
#timesCol .box{flex:1 1 auto;overflow:hidden}

/* ---------- donor wall ---------- */
#wallCol .label{margin-bottom:12px}
#wallCol h2{margin:0;font-family:"Playfair Display",serif;font-weight:600;font-size:45px;white-space:nowrap;line-height:1.05;letter-spacing:-.5px}
#wallCol h2{margin-bottom:20px !important}
#wallCol .intro{font-size:20px;color:var(--muted);margin:12px 0 22px;line-height:1.4}
#wallBox{position:relative;flex:1 1 auto;overflow:hidden;border-top:1px solid var(--rule);
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent)}
#wallInner{padding-top:22px}
.wgroup + .wgroup{margin-top:28px}
.wgroup .label{display:block;margin-bottom:12px;font-size:13px}
#wallInner{--ws:1}
.pillars div{font-family:"Playfair Display",serif;font-weight:500;font-size:calc(36px * var(--ws));line-height:1.3}
.partners{display:grid;grid-template-columns:1fr;column-gap:28px}
.partners.two{grid-template-columns:1fr 1fr;column-gap:20px}
.partners.two div{font-size:calc(24px * var(--ws))}
.partners div{font-family:"EB Garamond",Georgia,serif;font-size:calc(27px * var(--ws));line-height:1.45;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillars div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wempty{font-family:"Playfair Display",serif;font-style:italic;font-size:28px;color:var(--muted);padding-top:20px}

/* ---------- center ---------- */
#photoFrame{position:relative;width:100%;height:372px;background:var(--photo-bg);overflow:hidden;border-radius:6px;border:1.5px solid var(--box);flex:0 0 auto}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(24px) brightness(.8);opacity:.6}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}

#plaque{border-radius:6px !important;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:3px;padding:14px;
  background:linear-gradient(160deg,var(--plq1) 0%,var(--plq2) 60%,#D3B46C 100%);color:var(--plq-ink)}
#plaque .inner{height:100%;border:1px solid var(--plq-line);display:flex;flex-direction:column;align-items:center;padding:16px 40px 14px;text-align:center}
#plaqueTitle{margin:0;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:62px;line-height:1;direction:rtl}
#plaqueSub{display:none;font-weight:800;font-size:13px;letter-spacing:.4em;text-transform:uppercase;margin:10px 0 0;opacity:.75}
#plaqueText{margin-top:8px;flex:1 1 auto;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
#plaqueText span{display:block;font-family:"Playfair Display",serif;font-style:italic;font-weight:500;line-height:1.28}
#plaqueFade{transition:opacity .7s ease;display:flex;flex-direction:column;align-items:center;width:100%;height:100%}
#plaqueFade.out{opacity:0}

#tefillahSec{flex:0 0 196px;min-height:0;overflow:hidden}
#tefillahRows{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;direction:rtl}
#tefillahRows .row{font-size:23px}
#tefillahRows .row:nth-child(2){border-top:0}
#tefillahRows .v{font-weight:700}
#tefillahRows .v.no{font-weight:400;color:var(--muted)}

:root[data-theme="forest"]{--bg:#1F2B24;--panel:#26352C;--ink:#F1EEE4;--muted:#A8B3A9;--faint:#6F7D73;--rule:#3A4A40;--box:#4A5D50;--gold:#D2B36A;--photo-bg:#141C17}
:root[data-theme="wine"]{--bg:#2B1A1E;--panel:#352126;--ink:#F4ECE6;--muted:#BBA5A8;--faint:#7F676C;--rule:#4A3136;--box:#5C3E44;--gold:#D6B46C;--photo-bg:#1C1013}
:root[data-theme="slate"]{--bg:#2A3138;--panel:#323A42;--ink:#F0EEEA;--muted:#A9B1B9;--faint:#6E7780;--rule:#424B54;--box:#525C66;--gold:#D3B26A;--photo-bg:#1C2126}
:root[data-theme="parchment"]{--bg:#E9DEC6;--panel:#F4ECDB;--ink:#2A2418;--muted:#76694F;--faint:#A3957A;--rule:#D3C4A4;--box:#BBA982;--gold:#8C6A22;--photo-bg:#DDD0B4}
:root[data-theme="white"]{--bg:#FFFFFF;--panel:#F6F5F2;--ink:#1C1C1C;--muted:#6F6F6F;--faint:#A3A3A3;--rule:#E2E2E2;--box:#CFCFCF;--gold:#9A772A;--photo-bg:#ECECEC}
#themePick{position:fixed;left:12px;bottom:12px;z-index:9;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.72);font:600 13px "Nunito Sans",sans-serif;color:#fff}
#themePick button{cursor:pointer;border:2px solid transparent;border-radius:6px;padding:5px 9px;font:inherit;color:#111}
#themePick button.on{border-color:#fff;outline:2px solid #000}
#themePick button{cursor:pointer}
html.pick, html.pick *{cursor:auto}
#status{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--faint)}
/* plaque matches the other panels: same background, framed in gold */
#plaque{background:var(--panel);color:var(--ink);border:2px solid var(--gold);padding:9px}
#plaque .inner{border:1px solid var(--gold);opacity:1;padding:18px 40px 14px}
#plaqueTitle{color:var(--gold)}
#plaqueText span{color:var(--ink)}
/* frame around the whole screen */
:root{--frame:#2B2620}
#stage::after{content:"";position:absolute;inset:0;border:16px solid var(--frame);box-shadow:inset 0 0 0 2px var(--gold);pointer-events:none;z-index:5}
header{top:14px !important;left:44px !important;right:44px !important}
main{top:140px !important;bottom:32px !important;left:44px !important;right:44px !important}
#photoFrame{height:356px !important}
#timesCol .row{height:32px !important;line-height:32px !important}
#status{right:26px !important;bottom:20px !important}
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="h-left"><div id="clock" class="num">--:--</div><div id="engDate"></div></div>
    <div class="h-mid"><div id="logo" role="img" aria-label="Yeshiva Kol Torah of the Five Towns and Far Rockaway"></div></div>
    <div class="h-right he"><div id="hebDate"></div><div id="parsha"></div></div>
  </header>

  <main>
    <section class="col" id="wallCol">
      <div class="label">Add Your Voice</div>
      <h2>Our Monthly Partners</h2>
      <div id="wallBox"><div id="wallInner"></div></div>
    </section>

    <section class="col" id="centerCol">
      <div id="photoFrame"></div>
      <div id="plaque"><div class="inner"><div id="plaqueFade">
        <h1 id="plaqueTitle">פרנס היום</h1>
        <div id="plaqueSub">Parnes Hayom</div>
        <div id="plaqueText"><span></span></div>
      </div></div></div>
      <div id="tefillahSec" class="box">
        <div class="sec"><h2>היום בתפילה</h2></div>
        <div id="tefillahRows"></div>
      </div>
    </section>

    <section class="col" id="timesCol">
      <div class="box"><div class="sec"><h2>זמני היום</h2></div>
      <div class="rows" id="zmanimRows"></div></div>
      <div class="box"><div class="sec"><h2>זמני תפילה</h2></div>
      <div id="daveningRows"></div></div>
    </section>
  </main>
  <div id="status"></div>
</div>

/* ================= davening times ================= */
var DAY_KEYS={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sha:6,mot:6};
var HEB_DAY_LETTERS=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","שבת"];
function parseDays(s){
  var set=new Set(); s=(s||"").toLowerCase();
  if(/daily|every ?day/.test(s)){ [0,1,2,3,4,5].forEach(function(n){set.add(n);}); return set; }
  s.split(/,|&|\band\b|\//).forEach(function(part){
    part=part.trim(); if(!part) return;
    var rg=part.split(/\s*[-–]\s*/), k=function(w){ return DAY_KEYS[(w||"").trim().slice(0,3)]; };
    if(rg.length===2 && k(rg[0])!=null && k(rg[1])!=null){ for(var a=k(rg[0]),g=0; g<8; a=(a+1)%7,g++){ set.add(a); if(a===k(rg[1])) break; } }
    else if(k(part)!=null) set.add(k(part));
  });
  return set;
}
function hebDays(set){
  var a=Array.from(set).sort(function(x,y){return x-y;}), out=[], i=0;
  while(i<a.length){ var j=i; while(j+1<a.length && a[j+1]===a[j]+1) j++;
    if(j-i>=2) out.push(HEB_DAY_LETTERS[a[i]]+"–"+HEB_DAY_LETTERS[a[j]]); else for(var k=i;k<=j;k++) out.push(HEB_DAY_LETTERS[a[k]]);
    i=j+1; }
  return out.join(", ");
}
var TEFILLAH_HE={shacharis:"שחרית",shacharit:"שחרית",mincha:"מנחה",maariv:"מעריב",arvit:"מעריב"};
function tefHe(s){ var k=(s||"").trim().toLowerCase(); return TEFILLAH_HE[k] || s; }
function cleanTime(s){ return (s||"").replace(/\s*(am|pm|a\.m\.|p\.m\.)\s*$/i,"").trim(); }
function shabbosTimes(now){
  var dow=now.getDay(), fri = dow===6 ? addDays(now,-1) : addDays(now,(5-dow+7)%7), sat=addDays(fri,1);
  var shkF=minsOfDay(zman(fri).shkiah()), shkS=minsOfDay(zman(sat).shkiah());
  var candle=Math.floor(shkF-SHABBOS.candleMin);
  var mincha=Math.round((shkS-SHABBOS.minchaBeforeShkia)/5)*5; if(shkS-mincha<SHABBOS.minchaMinGap) mincha-=5;
  var maariv=Math.ceil(shkS+SHABBOS.maarivAfterShkia);
  return { parsha: parshaText(sat), rows:[
    ["הדלקת נרות", fmtMins(candle)],
    ["מנחה וקבלת שבת", fmtMins(candle)],
    ["שחרית", SHABBOS.shacharis],
    ["מנחה", fmtMins(mincha)],
    ["מעריב מוצאי שבת", fmtMins(maariv)]

}
function sub(a,b){ var s=el("div","sub"); s.append(el("span",null,a)); if(b) s.append(el("span",null,b)); return s; }
function renderDavening(now, rows){

var SEDER_HE={morning:"סדר בוקר",afternoon:"סדר אחר הצהריים",night:"סדר לילה",evening:"סדר לילה"};
function plaqueItems(data, now){
  var t=todayISO(now), items=[];
  (data.ded||[]).slice(1).forEach(function(r){
    if(!(r[1]||"").trim() || /^EXAMPLE/i.test(r[1]) || /pending/i.test(r[4]||"") || !covers(r,t)) return;
    var k=(r[2]||"").toLowerCase(), title="פרנס היום", sub="Parnes Hayom";
    if(/week|shavua/.test(k)){ title="פרנס השבוע"; sub="Parnes Hashavua"; }
    else if(/month|chodesh/.test(k)){ title="פרנס החודש"; sub="Parnes Hachodesh"; }
    else if(/mishmar/.test(k)){ title="משמר"; sub="Mishmar"; }
    else if(/seder/.test(k)){ var sd=(r[3]||"").trim(); title=SEDER_HE[sd.toLowerCase()]||"סדר"; sub=(sd?sd+" ":"")+"Seder"; }
    items.push({title:title, sub:sub, text:r[1].trim()});
  });
  var order=["Parnes Hachodesh","Parnes Hashavua","Parnes Hayom"];
  items.sort(function(a,b){ var x=order.indexOf(a.sub), y=order.indexOf(b.sub); return (x<0?9:x)-(y<0?9:y); });
  if(!items.length) items.push({title:"פרנס היום", sub:"Parnes Hayom", text:(data.settings&&data.settings.default_dedication)||"Today's learning is dedicated to the partners of Add Your Voice."});
  return items;
}

    var frag=document.createDocumentFragment(), lead=names.filter(function(x){return x.lead;}), rest=names.filter(function(x){return !x.lead;});
    if(lead.length){ var g=el("div","wgroup"); g.append(el("span","label","Pillars")); var p=el("div","pillars"); lead.forEach(function(x){p.append(el("div",null,x.n));}); g.append(p); frag.append(g); }
    if(rest.length){ var g2=el("div","wgroup"); g2.append(el("span","label","Partners")); var q=el("div","partners"+(rest.length>8?" two":"")); rest.forEach(function(x){q.append(el("div",null,x.n));}); g2.append(q); frag.append(g2); }
    return frag;
  };
  inner.replaceChildren();
  if(!names.length){ inner.append(el("div","wempty","Add your voice to the learning in our Yeshiva.")); return; }
  inner.append(build());
  requestAnimationFrame(function(){
    /* few names: make them bigger to fill the column (up to 1.5x) */
    var ws=1; inner.style.setProperty("--ws","1");
    var tooWide=function(){ return [].some.call(inner.querySelectorAll(".pillars div,.partners div"),function(d){ return d.scrollWidth>d.clientWidth+1; }); };
    while(ws<1.5 && inner.scrollHeight<box.clientHeight-40 && !tooWide()){ ws=Math.round((ws+0.05)*100)/100; inner.style.setProperty("--ws",ws); }
    if((inner.scrollHeight>box.clientHeight-40 || tooWide()) && ws>1){ ws=Math.round((ws-0.05)*100)/100; inner.style.setProperty("--ws",ws); }
    var h=inner.scrollHeight;
    if(h<=box.clientHeight-30) return;
    var gap=el("div"); gap.style.height="70px"; inner.append(gap, build());
    var dist=h+70;
    if(inner.animate) wallAnim=inner.animate([{transform:"translateY(0)"},{transform:"translateY(-"+dist+"px)"}],{duration:dist/20*1000,iterations:Infinity,easing:"linear"});
  });
}

/* ================= photos ================= */
var photos=[], slideIdx=-1, slideTimer=null, layers=[];
function driveUrl(id){ return "https://lh3.googleusercontent.com/d/"+encodeURIComponent(id)+"=w1600-h1000"; }
function photoList(rows){
  if(!rows || !rows.length) return [];
  var head=rows[0].map(function(h){return (h||"").toLowerCase();});
  var fi=head.findIndex(function(h){return /file id/.test(h);}), si=head.findIndex(function(h){return /show/.test(h);});
  if(fi<0) return [];
  return rows.slice(1).filter(function(r){ return (r[fi]||"").trim() && !(si>=0 && /^no$/i.test((r[si]||"").trim())); })
    .map(function(r){ var v=r[fi].trim(); return /^https?:/.test(v)?v:driveUrl(v); }).reverse().slice(0,MAX_PHOTOS);
}
function setPhotos(list){
  var next=(list && list.length)?list:FALLBACK_PHOTOS;
  if(JSON.stringify(next)===JSON.stringify(photos)) return;
  var wasFallback=(photos===FALLBACK_PHOTOS||!photos.length);
  photos=next;
  /* new emailed photos: show the newest one right away instead of waiting for the rotation */
  if(slideIdx<0 || wasFallback || next[0]!==shownFirst){ shownFirst=next[0]; slideIdx=-1; clearTimeout(slideTimer); nextSlide(); }
}
var shownFirst="";
function makeLayer(){ var s=el("div","slide"), bg=el("div","bg"), im=new Image(); im.alt=""; im.referrerPolicy="no-referrer"; /* Google Drive images refuse some referrers */ s.append(bg,im); $("photoFrame").append(s); return s; }
function nextSlide(tries){
  tries=tries||0; if(!photos.length) return;
  /* none of the emailed photos would load: show the yeshiva photos instead of a blank frame (tries again at the next data refresh) */
  if(tries>photos.length){ if(photos!==FALLBACK_PHOTOS){ photos=FALLBACK_PHOTOS; slideIdx=-1; nextSlide(); } return; }
  if(!layers.length) layers=[makeLayer(),makeLayer()];
  slideIdx=(slideIdx+1)%photos.length;
  var url=photos[slideIdx], cur=layers[0], nxt=layers[1], im=nxt.querySelector("img");
  im.onload=function(){
    nxt.classList.remove("on"); void nxt.offsetWidth; nxt.classList.add("on"); cur.classList.remove("on");
    layers=[nxt,cur];
    clearTimeout(slideTimer); slideTimer=setTimeout(nextSlide, SLIDE_SEC*1000);
  };
  im.onerror=function(){ clearTimeout(slideTimer); slideTimer=setTimeout(function(){ nextSlide(tries+1); }, 300); };
  im.src=url;
}

/* ================= data loading (keeps last good data) ================= */
var CACHE_KEY="kt-screen-v1", data={};
try{ data=JSON.parse(localStorage.getItem(CACHE_KEY)||"{}")||{}; }catch(e){ data={}; }
var DEMO_DATA={
  settings:{default_dedication:"Today's learning is dedicated to the partners of Add Your Voice."},
  ded:[["Date"],[todayISO(NOW()),"Today's learning is dedicated l'iluy nishmas Reb Yaakov ben Moshe z\"l, by his children and grandchildren.","Day","","Yes",""]],
  partners:[["Name"],["The Goldberg Family","Yes","180"],["Rabbi & Mrs. Dovid Klein","Yes","360"],["Mordechai Opoczynski","Yes","36"],["The Schwartz Family","Yes","72"],["Avi & Rivky Levine","Yes","36"],["Anonymous Friend","Yes","18"],["The Weiss Family","Yes","36"],["Yossi & Chani Stern","Yes","18"],["The Rosenberg Family","Yes","72"],["Moshe & Leah Katz","Yes","36"],["The Friedman Family","Yes","18"],["Shmuel & Dina Gold","Yes","72"]],
  dav:[["Tefillah"],["Shacharis","7:40 am","Sun-Fri"],["Mincha","2:35 pm","Sun-Thurs"],["Maariv","8:15 pm","Mon, Tues, Thurs"],["Maariv","10:30 pm","Sun, Wed"]]
};
function loadAll(){
  var ok=0;
  if(FORCE_DEMO){ data=DEMO_DATA; $("status").textContent="Sample names (preview only)"; renderData(); return Promise.resolve(); }
  var tabs=[["settings","Settings"],["ded","Dedications"],["partners","Partners"],["dav","Davening Times"],["photos","Screen Photos"]];
  return Promise.all(tabs.map(function(t){
    return loadTabRaw(t[1]).then(function(rows){
      if(t[0]==="photos"){ var h=(rows[0]||[]).join(" ").toLowerCase(); if(!/file id/.test(h)) rows=[]; } /* a missing tab returns the first tab */
      if(t[0]==="settings"){ var o={}; rows.slice(1).forEach(function(r){ if(r[0]) o[r[0].trim()]=(r[1]||"").trim(); }); data.settings=o; }
      else data[t[0]]=rows;
      ok++;
    }).catch(function(){});
  })).then(function(){
    if(ok){ data.at=Date.now(); try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){} }
    else if(DEMO && !data.at){ data=DEMO_DATA; }
    var demoNote=(data===DEMO_DATA)?"Sample names (preview only)":"";
    $("status").textContent = demoNote || (ok ? "" : (data.at ? "offline · showing data from "+new Date(data.at).toLocaleTimeString() : ""));
    renderData();
  });
}
function renderData(){
  var now=NOW();
  try{ renderPlaque(plaqueItems(data, now)); }catch(e){}
  try{ renderWall(data.partners); }catch(e){}
  try{ renderDavening(now, (data.dav||[]).slice(1)); }catch(e){}
  try{ setPhotos(photoList(data.photos)); }catch(e){ setPhotos([]); }
}
function renderDay(){
  var now=NOW(), ed=$("engDate");
  ed.replaceChildren(el("b",null,now.toLocaleDateString("en-US",{weekday:"long"})), document.createTextNode(now.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})));
  $("hebDate").textContent=HEB_DAYS[now.getDay()]+" · "+hebDate(now);
  $("parsha").textContent=parshaText(now);
  try{ renderZmanim(now); }catch(e){}
  try{ renderTefillah(now); }catch(e){}
}

/* ================= start ================= */
var lastDay=todayISO(NOW());
tickClock(); renderDay(); renderData();
setInterval(tickClock, 1000);
setInterval(function(){
  renderDay();
  if(todayISO(NOW())!==lastDay){ lastDay=todayISO(NOW()); renderData(); }
}, 60*1000);
loadAll(); setInterval(loadAll, REFRESH_MIN*60*1000);
/* once a day, reload the page (only if it can be reached, so a network blip never leaves a blank screen) */
(function(){
  var now=new Date(), t=new Date(now); t.setHours(RELOAD_HOUR,5,0,0); if(t<=now) t.setDate(t.getDate()+1);
  setTimeout(function tryReload(){
    fetch(location.href.split("#")[0],{cache:"no-store"}).then(function(r){ if(r.ok) location.reload(); else throw 0; })
      .catch(function(){ setTimeout(tryReload, 10*60*1000); });
  }, t-now);
})();
if(document.fonts) document.fonts.ready.then(function(){ var it=renderPlaque.items; if(it) showPlaque(it); wallKey=""; renderWall(data.partners); renderTefillah(NOW()); });
})();
</script>
